<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="관심종목">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>관심종목</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 디자인 수정 안내 ─────────────────────────────────────────────
   색·글꼴·간격은 아래 :root 변수만 바꾸면 전체에 적용됩니다.
   상승=빨강(--up), 하락=파랑(--dn) : 엑셀 결과 파일과 같은 규칙.
   데이터(data.enc.json)는 매일 06:30 자동분석 뒤 자동으로 바뀝니다.
   ──────────────────────────────────────────────────────────────── */
:root{
  --page:#f4f4f1; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.08); --wash:#efeee9;
  --up:#d03b3b; --up-soft:#fbe6e4; --dn:#2a78d6; --dn-soft:#e3eefb;
  --accent:#eb6834; --m5:#c47a00; --m20:#c47a00; --ma:#f5a524; --l5:#d6409f; --l20:#e89a14; --l60:#1a9e6e; --l120:#7b61d1; --now:#f2f2f0; --now-ring:#1f2a44; --band:#1f2a44; --warn-soft:#fdf1d6; --warn-ink:#7a5200;
  --f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#45443f; --ring:rgba(255,255,255,.08); --wash:#252523;
  --up:#e66767; --up-soft:#3d2120; --dn:#3987e5; --dn-soft:#1b2c43;
  --accent:#d95926; --m5:#f5b440; --m20:#f5b440; --ma:#e0a12a; --l5:#e86bb8; --l20:#f0b23a; --l60:#2fc28c; --l120:#9b86e8; --now:#e6e5e1; --now-ring:#0d0d0d; --band:#2c3b5e; --warn-soft:#3a2f14; --warn-ink:#fab219; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#45443f; --ring:rgba(255,255,255,.08); --wash:#252523;
  --up:#e66767; --up-soft:#3d2120; --dn:#3987e5; --dn-soft:#1b2c43;
  --accent:#d95926; --m5:#f5b440; --m20:#f5b440; --ma:#e0a12a; --l5:#e86bb8; --l20:#f0b23a; --l60:#2fc28c; --l120:#9b86e8; --now:#e6e5e1; --now-ring:#0d0d0d; --band:#2c3b5e; --warn-soft:#3a2f14; --warn-ink:#fab219; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.tn{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 0}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.asof{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--wash);color:var(--ink2)}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h2 small{font-size:11px;font-weight:500;color:var(--muted)}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--ink2)}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--wash);padding:4px;border-radius:14px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab b{font-weight:600;color:var(--muted);margin-left:4px;font-size:12px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.06)}
.tab[aria-selected="true"] b{color:var(--ink2)}

/* 종목 선택 */
.chipbar{position:sticky;top:0;z-index:5;background:var(--page);margin:0 -16px}
.chiprow{display:flex;align-items:center}
.fbtn{flex:none;margin-left:16px;border:0;border-radius:12px;padding:0 12px;height:44px;background:var(--surface);box-shadow:0 0 0 1px var(--ring);
  font-size:13px;font-weight:650;color:var(--ink2);cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--ink);color:var(--page);box-shadow:none}
.fbtn b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--page);color:var(--ink);font-size:11px;line-height:18px}
.fbtn + .chips{padding-left:8px;scroll-padding-left:8px}
.fpanel{padding:4px 16px 12px;display:grid;gap:10px;border-top:1px solid var(--grid)}
.fgrp{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start}
.fgrp > span{font-size:12px;color:var(--muted);padding-top:7px}
.fgrp > div{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:0;border-radius:999px;padding:6px 11px;background:var(--surface);box-shadow:0 0 0 1px var(--ring);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--page);box-shadow:none}
.fact{display:flex;justify-content:flex-end;gap:8px}
.fact button{border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 4px;cursor:pointer}
.fcount{font-size:12px;color:var(--muted);padding:0 2px}   /* 화면을 내려도 위에 고정 */
.chipbar.stuck{box-shadow:0 1px 0 var(--grid),0 6px 12px -8px rgba(0,0,0,.18)}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  padding:8px 16px;scroll-padding:0 16px;scrollbar-width:none}
/* 종목 카드 묶음: 휴대폰은 한 줄로 쌓고, 넓은 화면은 두 칸 */
.col{display:contents}
@media (min-width:768px){            /* 아이패드·작은 PC: 두 칸 (왼쪽 = 종목 정보, 오른쪽 = 차트 → 수급) */
  .wrap{max-width:1080px}
  .tabs{max-width:420px}
  #view{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start}
  #view .col{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
  #view .ca{grid-row:span 2}
}
@media (min-width:1280px){           /* 넓은 PC: 세 칸 */
  .wrap{max-width:1560px}
  #view{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto}
  #view .ca{grid-row:auto}
}
.desc{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:13px}
.desc dt{color:var(--muted);white-space:nowrap}
.desc dd{margin:0;color:var(--ink);word-break:keep-all}
.dsum{margin:0;padding:12px 0 0 18px;border-top:1px solid var(--grid);display:grid;gap:8px;font-size:13.5px;line-height:1.6;color:var(--ink);word-break:keep-all}
.dsum li::marker{color:var(--muted)}
.cinfo{font-size:12px;color:var(--ink2);min-height:18px;margin:-4px 0 6px;line-height:1.5}
.cinfo b{font-weight:650;color:var(--ink)}
.cinfo .cdate{font-size:13px}
.cinfo .cline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cinfo .cline.sm{font-size:11px;letter-spacing:-.02em}
.cma{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.cma i{display:inline-block;width:12px;height:2.5px;border-radius:2px;vertical-align:3px;margin-right:4px}
.cma b{font-weight:600}
.cbox{position:relative;touch-action:pan-y}
.cbox svg{display:block}
.cbox .ax{font-family:var(--f);font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.cbox .ax.bs{fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chips::-webkit-scrollbar{display:none}
.pick{flex:none;scroll-snap-align:start;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--ring);border-radius:12px;
  padding:8px 13px 7px;text-align:left;cursor:pointer;line-height:1.25}
.pick b{display:block;font-size:14px;font-weight:650;white-space:nowrap;letter-spacing:-.01em}
.pick span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.pick[aria-selected="true"]{background:var(--ink);color:var(--page);box-shadow:none}
.pick[aria-selected="true"] span{color:var(--page);opacity:.7}

/* 종목 머리 */
.name-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nlink{flex:none;font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none;padding:6px 11px;border-radius:999px;background:var(--wash);white-space:nowrap}
.nlink:hover{color:var(--ink);background:var(--grid)}
.hero .name{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.hero .reg{font-size:12px;color:var(--muted);margin-top:2px}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-top:12px;flex-wrap:wrap}
.price{font-size:clamp(34px,10vw,42px);font-weight:700;letter-spacing:-.04em;line-height:1}
.price small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.wk{display:grid;justify-items:end;gap:2px}
.wk span{font-size:11px;color:var(--muted)}
.wk b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--grid)}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.tile b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.tile em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.tile b i,.tile em i{font-style:normal}
.tiles.five{gap:10px 6px;grid-template-columns:repeat(5,minmax(0,1fr))}   /* 칸 수가 적어도 같은 폭으로 왼쪽부터 채움 */
.tiles.five .tile span{white-space:normal;line-height:1.25;min-height:28px;word-break:keep-all}
.tiles.five .tile b{font-size:clamp(12px,3.7vw,14px);letter-spacing:-.02em}
.tiles.five .tile em{line-height:1.35;margin-top:2px}
.prow.vrow2{grid-template-columns:1fr auto;min-height:42px}

/* 보유 */
.hold{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px}   /* 머리 카드와 같은 5칸 틀, 왼쪽부터 */
.hold .wide{grid-column:span 2}
.hold .pl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--wash)}
.hold .pl span{font-size:12px;color:var(--ink2)}
.hold .pl b{font-size:22px;font-weight:700;letter-spacing:-.03em}
.hold .pl i{font-style:normal;font-size:14px;font-weight:650;margin-left:8px}

.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

/* 최근 4거래일 등락률 (숫자) */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.days div{background:var(--wash);border-radius:10px;padding:7px 4px 6px;text-align:center}
.days span{display:block;font-size:11px;color:var(--muted)}
.days b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.days-cap{font-size:11px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--grid)}
.days-cap + .days{margin-top:6px}

/* 가격 목록 (기준·매수·최고가 / 이평·볼린저) */
.plist{display:grid}
.prow{display:grid;grid-template-columns:1fr auto 78px;gap:10px;align-items:center;min-height:46px;padding:6px 0;border-top:1px solid var(--grid)}
.prow:first-child{border-top:0}
.prow .lb{font-size:14px;font-weight:600;line-height:1.25}
.prow .lb em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
.prow .pv{font-size:15px;font-weight:650;text-align:right}
.prow .pc{text-align:right;line-height:1.2}
.prow .pc b{display:block;font-size:14px;font-weight:700}
.prow .pc em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.prow.now{background:var(--wash);border-radius:10px;margin:2px -8px;padding:6px 8px;border-top:0}
.prow.now + .prow{border-top:0}
.prow.mine .lb{color:var(--accent)}

/* 이평·볼린저 밴드 차트 */
.band{position:relative;margin:4px 0 14px;padding:0 6px}
.band .leads{position:absolute;top:0;bottom:0;left:6px;right:6px;pointer-events:none}
.band .ld{position:absolute;width:0;border-left:1.5px dotted var(--axis);margin-left:-.75px}
.band .lane{position:relative;z-index:1;height:20px;font-size:12px;color:var(--ink2)}
.band .bl{position:absolute;top:2px;white-space:nowrap;line-height:16px;background:var(--surface);padding:0 3px;border-radius:3px}
/* 이름표 첫 글자를 점선에 맞춤(padding 3px 만큼 당김). 오른쪽 끝에서 넘치면 끝 글자를 맞춤 */
.band .bl.l{transform:translateX(-3px)} .band .bl.r{transform:translateX(calc(-100% + 3px))}
.band .bl b{font-weight:650;color:var(--ink)}
.band .bl.now{font-weight:700;color:var(--ink)}
.band .track{position:relative;height:24px;margin:2px 0 4px}
.band .track::before{content:"";position:absolute;left:0;right:0;top:11.5px;height:1px;background:var(--grid)}
.band .zone{position:absolute;top:4px;height:16px;border-radius:4px;background:var(--band)}
.band .mazone{position:absolute;top:4px;height:16px;background:var(--ma)}
.band .dot{position:absolute;top:8px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--now);box-shadow:0 0 0 2px var(--now-ring)}
.m5,.m20{background:var(--ma)}
.prow.m5,.prow.m20{background:none}

/* 기관·외인 수급 가로 막대 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--wash);padding:3px;border-radius:10px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.vgrid{display:grid}
.vrow{display:grid;gap:4px;align-items:center;padding:8px 0;border-top:1px solid var(--grid)}
.vrow.vhead{border-top:0;padding:0 0 4px;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
.vrow .lb{font-size:13px;font-weight:650;color:var(--ink);line-height:1.2}
.vrow .lb em{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--muted)}
.vc{display:grid;justify-items:center;gap:2px;min-width:0;text-align:center}
.vc .vt{position:relative;width:100%;height:40px}
.vc .vt::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:var(--axis)}
.vc .vb{position:absolute;left:50%;width:14px;margin-left:-7px}
.vc .vb.p{bottom:50%;background:var(--up);border-radius:4px 4px 0 0}
.vc .vb.n{top:50%;background:var(--dn);border-radius:0 0 4px 4px}
.vc b{font-size:13px;font-weight:700;white-space:nowrap;line-height:1.2}
.vc em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.vc .part{margin-left:0}
.vrow.sum{background:var(--wash);border-radius:10px;border-top:0;margin-top:4px;padding:8px 6px;margin-left:-6px;margin-right:-6px}
.part{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);margin-left:4px;vertical-align:1px}

/* 전체 값 표 */
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"펼치기";font-size:11px;font-weight:500;color:var(--muted)}
details[open] summary::after{content:"접기"}
.kv{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.kv td{padding:6px 0;border-top:1px solid var(--grid);vertical-align:top}
.kv td:first-child{color:var(--ink2);padding-right:10px;word-break:keep-all}
.kv td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.errs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:12.5px}
.errs li{padding:8px 10px;border-radius:10px;background:var(--wash);color:var(--ink2)}
.errs b{color:var(--ink);font-weight:650}

/* 잠금 화면 */
.lock{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.lock h1{font-size:20px}
.lock p{margin:0;font-size:13px;color:var(--ink2)}
.lock input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--ring);font-size:16px}
.lock label{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.lock .go{padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--page);font-size:15px;font-weight:700;cursor:pointer}
.lock .go:disabled{opacity:.5}
.lock .msg{min-height:18px;font-size:13px;color:var(--up)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<form class="lock" id="lock" hidden autocomplete="on">
  <h1>관심종목</h1>
  <p>암호를 입력하면 최근 결과를 볼 수 있습니다.</p>
  <input type="text" name="username" value="stock-pick" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="암호" required>
  <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
  <button class="go" id="go" type="submit">열기</button>
  <div class="msg" id="msg" role="alert"></div>
</form>

<!-- 본문 -->
<div class="wrap" id="app" hidden>
  <header>
    <h1>관심종목</h1>
    <div class="asof"><span class="chip tn" id="asof"></span><button class="iconbtn" id="logout" type="button">잠금</button></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="buy" id="t-buy">매수종목<b></b></button>
    <button class="tab" role="tab" data-tab="recent" id="t-recent">2개월이내<b></b></button>
  </div>
  <div class="chipbar" id="chipbar">
    <div class="chiprow">
      <button type="button" class="fbtn" id="fbtn" aria-expanded="false" hidden>필터</button>
      <div class="chips" id="chips" role="tablist" aria-label="종목 선택 (옆으로 밀어서 보기)"></div>
    </div>
    <div class="fpanel" id="fpanel" hidden></div>
  </div>
  <div id="view" class="stack"></div>
  <div class="card" id="errCard" hidden>
    <details><summary id="errSum"></summary><ul class="errs" id="errList"></ul></details>
  </div>
  <div class="note" id="built" style="text-align:center"></div>
</div>

<script>
"use strict";
const DATA_URL = "data.enc.json";
const KEY_PW = "sp_pw", KEY_TAB = "sp_tab", KEY_SEL = "sp_sel_";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── 복호화 (PBKDF2-SHA256 → AES-256-GCM) ── */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBlob(blob, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ── 숫자 표시: 엑셀 결과 파일의 표시 형식과 같게 ── */
const DATE_COLS = new Set(["등록일자","최고가일","거래량_날짜","5고가일","20고가일"]);
const INT_COLS = new Set(["시가총액","현재가","기준가","매수가","보유수량","매수금액","최고가","5일선","20일선",
  "볼린저up","볼린저lo","거래량_종가","5고가","20고가"]);
const RAW_COLS = new Set(["종목명","회전율"]);
const isNum = v => typeof v === "number" && isFinite(v);
const blank = v => v === null || v === undefined || v === "";
function fDate(v){ if (blank(v)) return "—"; const s = String(v); return /^\d{8}$/.test(s) ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6)}` : s; }
function fShortDate(v){ const s = String(v ?? ""); return /^\d{8}$/.test(s) ? `${+s.slice(4,6)}/${+s.slice(6)}` : s; }
function fInt(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-"; return Math.round(v).toLocaleString("ko-KR"); }
function fSignedInt(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-";
  return (v > 0 ? "+" : "-") + Math.abs(Math.round(v)).toLocaleString("ko-KR"); }
function fPct(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-";
  return (v > 0 ? "+" : "-") + Math.abs(v).toFixed(2); }
const cls = v => !isNum(v) || v === 0 ? "fl" : v > 0 ? "up" : "dn";
function colType(name){
  if (DATE_COLS.has(name)) return "date";
  if (RAW_COLS.has(name) || name.endsWith("_자료확보")) return "raw";
  if (name === "평가손익") return "sint";
  if (INT_COLS.has(name) || name.endsWith("(평단)")) return "int";
  return "pct";
}
function fmt(name, v){
  switch (colType(name)){
    case "date": return fDate(v);
    case "raw": return blank(v) ? "—" : String(v);
    case "sint": return fSignedInt(v);
    case "int": return fInt(v);
    default: return fPct(v);
  }
}
const colored = (name, v) => `<span class="tn ${["pct","sint"].includes(colType(name)) ? cls(v) : ""}">${esc(fmt(name, v))}</span>`;
function fCap(v){ if (!isNum(v)) return "—"; return Math.round(v / 1e8).toLocaleString("ko-KR") + "억"; }   // 시가총액은 억 단위

/* ── 상태 ── */
let DATA = null, TAB = "buy";
const sheet = k => DATA.sheets[k] || {cols:[], rows:[]};
function rowObj(k, i){ const s = sheet(k), o = {}; s.cols.forEach((c, j) => o[c] = s.rows[i][j]); return o; }
function optLabel(k, i){
  const r = rowObj(k, i), s = sheet(k);
  const dup = s.rows.filter((_, j) => rowObj(k, j)["종목명"] === r["종목명"]).length > 1;
  return `${r["종목명"]} · ${fShortDate(r["등록일자"])}` + (dup ? " 등록" : "");
}

/* ── 그리기 ── */
const pctTxt = v => fPct(v) + (isNum(v) && v !== 0 ? "%" : "");   // 0 은 엑셀처럼 "-"
/* 휴대폰·태블릿 판별 (아이패드는 Mac처럼 보이지만 터치가 있음) */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
function heroCard(r, k, i){
  const pctEm = (p, d) => { const ds = fShortDate(d);
    const ps = isNum(p) ? `<i class="${cls(p)}">${p === 0 ? "0.00" : fPct(p)}%</i>` : "";
    return ps + (ps && ds ? "<br>" : "") + ds; };
  const tiles = [
    ["주간등락률", `<i class="${cls(r["주간등락률"])}">${fPct(r["주간등락률"])}${isNum(r["주간등락률"]) && r["주간등락률"] !== 0 ? "%" : ""}</i>`, ""],
    ["기준가", fInt(r["기준가"]), (() => {   // 기준가 대비 현재가 등락률 (엑셀에 없는 열이라 화면에서 계산: 현재가 ÷ 기준가 − 1)
      const c = r["현재가"], s = r["기준가"];
      if (!isNum(c) || !isNum(s) || s === 0) return "";
      const v = Math.round((c / s * 100 - 100) * 100) / 100;
      return `<i class="${cls(v)}">${v === 0 ? "0.00" : fPct(v)}%</i><br>현재가`;
    })()],
  ];
  if (k === "recent") tiles.push(
    ["5거래일 고가", fInt(r["5고가"]), pctEm(r["5고가_기준대비"], r["5고가일"])],
    ["20거래일 고가", fInt(r["20고가"]), pctEm(r["20고가_기준대비"], r["20고가일"])]);
  tiles.push(["최고가", fInt(r["최고가"]), pctEm(r["최고가대비"], r["최고가일"])]);
  const tile = ([a, b, c]) => `<div class="tile"><span>${a}</span><b>${b}</b>${c ? `<em>${c}</em>` : ""}</div>`;
  const days = ["D-3","D-2","D-1","D"].map(d => `<div><span>${d}</span><b class="${cls(r[d])}">${pctTxt(r[d])}</b></div>`).join("");
  return `<div class="card hero">
    <div class="name-row"><div class="name">${esc(r["종목명"])}</div>${(() => {   // 네이버 증권 종목 화면 (새 창)
      const code = DATA.codes && DATA.codes[k] ? DATA.codes[k][i] : null;
      if (!code) return "";
      const c = encodeURIComponent(code), url = IS_MOBILE ? `https://m.stock.naver.com/domestic/stock/${c}/total`
        : `https://finance.naver.com/item/main.naver?code=${c}`;   // PC는 네이버 증권 PC 화면
      return `<a class="nlink" href="${url}" target="_blank" rel="noopener">네이버 증권 ↗</a>`;
    })()}</div>
    <div class="reg tn">등록일자 ${fDate(r["등록일자"])}</div>
    <div class="hero-row">
      <div class="price tn">${fInt(r["현재가"])}<small>원</small></div>
      <div class="wk"><span>시가총액</span><b class="tn">${fCap(r["시가총액"])}</b></div>
    </div>
    <div class="tiles five tn">${tiles.map(tile).join("")}</div>
    <div class="note" style="margin-top:6px">기준가 아래 %는 기준가 대비 현재가, 고가·최고가 아래 %는 기준가 대비입니다.</div>
    <div class="days-cap">최근 4거래일 등락률 · D = ${fDate(DATA.asof.replaceAll("-",""))}</div>
    <div class="days tn">${days}</div>
  </div>`;
}
function holdCard(r){
  return `<div class="card"><h2>보유</h2>
    <div class="hold tn">
      <div class="pl"><span>평가손익</span><div><b class="${cls(r["평가손익"])}">${fSignedInt(r["평가손익"])}</b><i class="${cls(r["매수가대비"])}">${fPct(r["매수가대비"])}%</i></div></div>
      <div class="tile"><span>매수가</span><b>${fInt(r["매수가"])}</b></div>
      <div class="tile"><span>보유수량</span><b>${fInt(r["보유수량"])}</b></div>
      <div class="tile wide"><span>매수금액</span><b>${fInt(r["매수금액"])}</b></div>
    </div></div>`;
}
/* 거래량 · 회전율 카드 (매수종목 탭은 거래량 자료가 없어 회전율만) */
function volCard(r, k){
  const rows = k === "recent" ? [
    ["거래량일", blank(r["거래량_날짜"]) ? "—" : fDate(r["거래량_날짜"])],
    ["거래량일 종가", fInt(r["거래량_종가"])],
    ["거래량일 등락률", `<span class="${cls(r["거래량_등락률"])}">${fPct(r["거래량_등락률"])}${isNum(r["거래량_등락률"]) && r["거래량_등락률"] !== 0 ? "%" : ""}</span>`],
    ["회전율", blank(r["회전율"]) ? "—" : esc(r["회전율"]) + "%"],
  ] : [["회전율", blank(r["회전율"]) ? "—" : esc(r["회전율"]) + "%"]];
  return `<div class="card"><h2>${k === "recent" ? "거래량 · 회전율" : "회전율"}</h2><div class="plist">${
    rows.map(([a, b]) => `<div class="prow vrow2"><div class="lb">${a}</div><div class="pv tn">${b}</div></div>`).join("")}</div></div>`;
}
/* 가격 한 줄: [이름, 보조설명, 가격, %값, %설명, 종류] */
function priceRows(items){
  return items.map(([lb, sub, v, pct, pcap, kind]) => `<div class="prow ${kind || ""}">
      <div class="lb">${lb}${sub ? `<em class="tn">${esc(sub)}</em>` : ""}</div>
      <div class="pv tn">${fInt(v)}</div>
      <div class="pc tn">${pct === undefined ? "" : `<b class="${cls(pct)}">${pct === 0 ? "0.00" : fPct(pct)}${isNum(pct) ? "%" : ""}</b>${pcap ? `<em>${pcap}</em>` : ""}`}</div>
    </div>`).join("");
}
/* 최근 30거래일 주가 차트 (일봉 + 거래량). 자료: 웹 갱신 때 네이버 일봉을 함께 받아 암호화해 둔 것 */
function chartCard(r, k, i){
  const code = DATA.codes && DATA.codes[k] ? DATA.codes[k][i] : null;
  const d = code && DATA.ohlc ? DATA.ohlc[code] : null;
  if (!d || d.length < 2) return "";
  return `<div class="card"><h2>최근 ${d.length}거래일 주가 <small class="tn">${esc(code)}</small></h2>
    <div class="cinfo tn" id="cinfo"></div>
    <div class="cbox" id="cbox" data-code="${esc(code)}" data-base="${isNum(r["기준가"]) ? r["기준가"] : ""}" data-reg="${esc(r["등록일자"] ?? "")}"></div>
</div>`;
}
function drawChart(){
  const box = $("cbox"); if (!box) return;
  const d = DATA.ohlc[box.dataset.code], n = d.length;
  const W = Math.max(240, box.clientWidth), H = 220, padR = 50, plotW = W - padR;
  const pT = 10, pH = 142, vT = 166, vH = 46;
  const MAS = [[6, 5, "--l5"], [7, 20, "--l20"], [8, 60, "--l60"], [9, 120, "--l120"]];   // [열, 일수, 색]
  const maVals = d.flatMap(z => MAS.map(([k]) => z[k])).filter(v => isNum(v));
  let lo = Math.min(...d.map(x => x[3]), ...maVals), hi = Math.max(...d.map(x => x[2]), ...maVals);
  const base = +box.dataset.base, span0 = hi - lo || hi * 0.05;
  const baseIn = base > 0 && base >= lo - span0 * 0.15 && base <= hi + span0 * 0.15;   // 너무 멀면 차트를 찌그러뜨리지 않게 빼고 글로 표시
  if (baseIn){ lo = Math.min(lo, base); hi = Math.max(hi, base); }
  const pad = (hi - lo) * 0.05 || 1; lo -= pad; hi += pad;
  const y = v => pT + (hi - v) / (hi - lo) * pH;
  const step = plotW / n, cw = Math.max(2, Math.min(12, step * 0.62)), x = j => step * (j + 0.5);
  const vmax = Math.max(...d.map(z => z[5])) || 1;
  const col = z => z[4] > z[1] ? "var(--up)" : z[4] < z[1] ? "var(--dn)" : "var(--ink2)";
  let s = "";
  [hi - pad, (hi + lo) / 2, lo + pad].forEach(v => {   // 가로 눈금 3줄
    s += `<line x1="0" x2="${plotW}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`
       + `<text x="${plotW + 6}" y="${y(v) + 4}" class="ax">${fInt(Math.round(v))}</text>`;
  });
  s += `<line x1="0" x2="${plotW}" y1="${vT + vH}" y2="${vT + vH}" stroke="var(--grid)"/>`;
  const ri = d.findIndex(z => z[0] === box.dataset.reg);
  if (ri >= 0) s += `<line x1="${x(ri)}" x2="${x(ri)}" y1="${pT}" y2="${vT + vH}" stroke="var(--axis)" stroke-dasharray="2 3"/>`
     + `<text x="${Math.min(plotW - 24, x(ri) + 3)}" y="${pT + pH - 3}" class="ax bs">등록</text>`;
  if (baseIn) s += `<line x1="0" x2="${plotW}" y1="${y(base)}" y2="${y(base)}" stroke="var(--ink2)" stroke-dasharray="4 3" opacity=".7"/>`
     + `<text x="4" y="${y(base) - 4}" class="ax bs">기준가 ${fInt(base)}</text>`;   // 기준가 글자는 차트 안 왼쪽 (오른쪽 눈금과 겹치지 않게)
  d.forEach((z, j) => {
    const c = col(z), xx = x(j);
    s += `<line x1="${xx}" x2="${xx}" y1="${y(z[2])}" y2="${y(z[3])}" stroke="${c}" stroke-width="1"/>`;
    const top = y(Math.max(z[1], z[4])), h = Math.max(1, Math.abs(y(z[1]) - y(z[4])));
    s += `<rect x="${xx - cw / 2}" y="${top}" width="${cw}" height="${h}" fill="${c}" rx="1"/>`;
    const vh = z[5] / vmax * vH;
    s += `<rect x="${xx - cw / 2}" y="${vT + vH - vh}" width="${cw}" height="${vh}" fill="${c}" opacity=".35"/>`;
  });
  MAS.forEach(([k, , c]) => {
    const pts = d.map((z, j) => isNum(z[k]) ? `${x(j).toFixed(1)},${y(z[k]).toFixed(1)}` : null).filter(Boolean);
    if (pts.length > 1) s += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(${c})" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  s += `<line id="cx" x1="0" x2="0" y1="${pT}" y2="${vT + vH}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`
     + `<rect id="chit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${n}거래일 일봉과 거래량">${s}</svg>`
    + (base > 0 && !baseIn ? `<div class="note" style="margin-top:2px">기준가 ${fInt(base)}원은 차트 범위 ${base > hi ? "위" : "아래"}에 있습니다.</div>` : "");
  const show = (j, picked) => {
    const z = d[j], p = j > 0 ? d[j - 1][4] : null, chg = p ? Math.round((z[4] / p * 100 - 100) * 100) / 100 : null;
    const line = withChg => `시 ${fInt(z[1])} · 고 ${fInt(z[2])} · 저 ${fInt(z[3])} · 종 <b class="${cls(chg)}">${fInt(z[4])}</b>`
      + (withChg && chg !== null ? ` <span class="${cls(chg)}">(${pctTxt(chg)})</span>` : "") + ` · 거래량 ${fInt(z[5])}`;
    $("cinfo").innerHTML = `<div class="cdate"><b>${fShortDate(z[0])}</b></div><div class="cline" id="cline">${line(true)}</div>`
      + `<div class="cma">${MAS.map(([k, n2, c]) => `<span><i style="background:var(${c})"></i>${n2}일 <b>${isNum(z[k]) ? fInt(z[k]) : "—"}</b></span>`).join("")}</div>`;
    const cl = $("cline");   // 한 줄에 안 들어가면 등락률을 빼고, 그래도 넘치면 글자를 조금 줄임
    if (cl.scrollWidth > cl.clientWidth) cl.innerHTML = line(false);
    if (cl.scrollWidth > cl.clientWidth) cl.classList.add("sm");
    const l = $("cx"); l.setAttribute("x1", x(j)); l.setAttribute("x2", x(j)); l.setAttribute("opacity", picked ? .35 : 0);
  };
  const pick = e => { const rc = box.querySelector("svg").getBoundingClientRect();
    show(Math.max(0, Math.min(n - 1, Math.floor((e.clientX - rc.left) / step))), true); };
  const hit = $("chit");
  hit.addEventListener("pointermove", pick);
  hit.addEventListener("pointerdown", pick);
  hit.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(n - 1, false); });
  show(n - 1, false);
}
window.addEventListener("resize", () => { clearTimeout(window._crt); window._crt = setTimeout(drawChart, 150); });
function lineCard(r){
  const cur = r["현재가"], m5 = r["5일선"], m20 = r["20일선"], up = r["볼린저up"], lo = r["볼린저lo"];
  const ok = v => isNum(v) && v !== 0;
  const items = [
    ["현재가", "", cur, undefined, "", "now"],
    ["5일선", "", m5, r["5일선대비"], "현재가 위치", "m5"],
    ["20일선", "", m20, r["20일선대비"], "현재가 위치", "m20"],
    ["볼린저 상단", "", up, r["볼린저up_대비"], "현재가 대비"],
    ["볼린저 하단", "", lo, r["볼린저lo_대비"], "현재가 대비"],
  ].filter(it => ok(it[2]));
  if (!ok(cur) || items.length < 2) return "";
  return `<div class="card"><h2>이동평균선 · 볼린저 밴드</h2>${bandChart(cur, m5, m20, up, lo)}
    <div class="plist">${priceRows(items)}</div>
    <div class="note">%는 엑셀 값 그대로입니다. 이평선은 현재가가 선보다 몇 % 위(+)·아래(−)인지, 볼린저는 밴드가 현재가보다 몇 % 위(+)·아래(−)인지입니다.</div></div>`;
}
/* 밴드 차트: 볼린저 하단~상단을 띠로, 5일선·20일선은 세로 표시, 현재가는 점 */
function bandChart(cur, m5, m20, up, lo){
  const ok = v => isNum(v) && v !== 0;
  const vals = [cur, m5, m20, up, lo].filter(ok);
  let a = Math.min(...vals), b = Math.max(...vals);

const full = s => { if (blank(s)) return true; const m = String(s).match(/^(\d+)\/(\d+)$/); return !m || m[1] === m[2]; };

function supplyCard(r){
  const per = [["5","5일"],["20거래일","20일"],["60거래일","60일"],["120거래일","120일"]];
  const flowCol = (inv, key) => inv === "합계" ? `${key}순매수` : `${inv}_순매수(${key})`;
  const NAME = { "기관": "기관", "외인": "외국인", "합계": "합계" };
  const cols = SUP_MODE === "flow" ? per : per.slice(1);
  const invs = SUP_MODE === "flow" ? ["기관","외인","합계"] : ["기관","외인"];
  const rows = invs.map(inv => ({ inv, cells: cols.map(([key]) => {
    if (SUP_MODE === "flow"){
      const c = flowCol(inv, key), cov = r[c + "_자료확보"];
      return { v: r[c], part: full(cov) ? "" : cov };
    }
    const n = key.replace("거래일", "");
    return { v: r[`${n}거래일/${inv}(평단%)`], sub: "평단 " + fInt(r[`${n}거래일/${inv}(평단)`]) };
  }) }));
  const nums = rows.flatMap(x => x.cells.map(c => c.v)).filter(isNum);
  if (!nums.length) return "";
  const max = Math.max(0, ...nums.map(Math.abs)) || 1;

  const seg = (m, t) => `<button type="button" data-sup="${m}" aria-pressed="${SUP_MODE === m}">${t}</button>`;
  const cap = SUP_MODE === "flow" ? "상장주식수 대비 순매수 %(거래일 기준). 노란 표시는 자료가 일부만 확보된 기간(확보일/전체일)입니다."
    : "현재가가 기관·외국인 매수평단보다 몇 % 위(+)·아래(−)인지입니다(거래일 기준). 5일 평단은 엑셀에 없습니다.";
  return `<div class="card"><h2>기관 · 외국인 수급</h2>

/* ── 2개월이내 필터: 엑셀 값으로 판단, 여러 개 고르면 모두 만족하는 종목만 ── */
const N = v => isNum(v) ? v : NaN;
/* 5-20 돌파: 돌파 직전(임박) 또는 막 돌파한 종목. 차트용 일봉의 5일·20일 이평 값 사용
   - 임박: 5일선이 아직 20일선 아래(같음 포함), 차이가 20일선의 5% 이내, 3거래일 전보다 차이가 줄어듦
   - 막 돌파: 최근 3거래일 안에 5일선이 20일선을 아래→위로 넘었고 지금도 위 */
const CROSS_GAP = 5, CROSS_NARROW = 3, CROSS_RECENT = 3;
function crossSoon(i){
  const code = DATA.codes && DATA.codes[TAB] ? DATA.codes[TAB][i] : null;
  const d = code && DATA.ohlc ? DATA.ohlc[code] : null;
  if (!d || d.length < CROSS_NARROW + 1) return false;
  const n = d.length, ok = z => isNum(z[6]) && isNum(z[7]) && z[7] > 0, gap = z => (z[7] - z[6]) / z[7] * 100;
  const last = d[n - 1], prev = d[n - 1 - CROSS_NARROW];
  if (!ok(last)) return false;
  if (last[6] <= last[7]) return gap(last) <= CROSS_GAP && ok(prev) && gap(last) < gap(prev);
  for (let t = Math.max(1, n - CROSS_RECENT); t < n; t++)
    if (ok(d[t - 1]) && ok(d[t]) && d[t - 1][6] <= d[t - 1][7] && d[t][6] > d[t][7]) return true;
  return false;
}
const FILTERS = [
  ["이동평균", "ma5u",  "5일선 위",    r => N(r["현재가"]) > N(r["5일선"]),   "ma5d"],

  ["최고가",   "hi5",   "기준가 대비 5% 이내",  r => N(r["최고가대비"]) <= 5,  "hi10"],
  ["수급(20거래일)", "inst", "기관 순매수", r => N(r["기관_순매수(20거래일)"]) > 0, ""],
  ["수급(20거래일)", "frgn", "외국인 순매수", r => N(r["외인_순매수(20거래일)"]) > 0, ""],
];
let FSEL = new Set((store.get("sp_filter") || "").split(",").filter(id => FILTERS.some(f => f[1] === id)));

const ftest = (id, r, i) => { const f = FILTERS.find(x => x[1] === id); return !!f && f[3](r, i); };
/* 여러 조건은 모두 만족(그리고). 단, '하단 위 3% 이내'와 '하단 아래'를 같이 켜면 둘 중 하나만 맞아도 보임(또는) */
const passes = (r, i) => {
  const ids = [...FSEL], lowPair = ids.includes("bbn") && ids.includes("bbd");

};

async function loadBlob(){
  if (BLOB) return BLOB;
  const res = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"});
  if (!res.ok) throw new Error("데이터 파일을 받지 못했습니다 (" + res.status + ")");
  return BLOB = await res.json();
}
async function unlock(pw, remember){
  const blob = await loadBlob();
  const data = await decryptBlob(blob, pw);
  if (remember) store.set(KEY_PW, pw); else store.del(KEY_PW);
  start(data);
}
$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value; if (!pw) return;
  $("go").disabled = true; $("go").textContent = "여는 중…"; $("msg").textContent = "";
  try { await unlock(pw, $("remember").checked); }
  catch (err){ $("msg").textContent = err && err.name === "OperationError" ? "암호가 맞지 않습니다." : (err.message || "열지 못했습니다."); }
  finally { $("go").disabled = false; $("go").textContent = "열기"; }
});
(async () => {
  if (!window.crypto || !crypto.subtle){ $("lock").hidden = false; $("msg").textContent = "이 브라우저에서는 열 수 없습니다(https 주소로 접속하세요)."; return; }
  const saved = store.get(KEY_PW);
  if (saved){
    try { await unlock(saved, true); return; }
    catch (err){ if (err && err.name === "OperationError") store.del(KEY_PW); else { $("msg").textContent = err.message || ""; } }
  }
  $("lock").hidden = false; $("pw").focus();
})();
</script>
