<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="관심종목">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>관심종목</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 디자인 수정 안내 ─────────────────────────────────────────────
   색·글꼴·간격은 아래 :root 변수만 바꾸면 전체에 적용됩니다.
   상승=빨강(--up), 하락=파랑(--dn) : 엑셀 결과 파일과 같은 규칙.
   데이터(data.enc.json)는 매일 06:30 자동분석 뒤 자동으로 바뀝니다.
   ──────────────────────────────────────────────────────────────── */
:root{
  --page:#f4f4f1; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.08); --wash:#efeee9;
  --up:#d03b3b; --up-soft:#fbe6e4; --dn:#2a78d6; --dn-soft:#e3eefb;
  --accent:#eb6834; --m5:#c47a00; --m20:#c47a00; --ma:#f5a524; --now:#13a8c9; --band:#4a4945; --warn-soft:#fdf1d6; --warn-ink:#7a5200;
  --f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#45443f; --ring:rgba(255,255,255,.08); --wash:#252523;
  --up:#e66767; --up-soft:#3d2120; --dn:#3987e5; --dn-soft:#1b2c43;
  --accent:#d95926; --m5:#f5b440; --m20:#f5b440; --ma:#d99520; --now:#3cc3e0; --band:#5c5b56; --warn-soft:#3a2f14; --warn-ink:#fab219; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#45443f; --ring:rgba(255,255,255,.08); --wash:#252523;
  --up:#e66767; --up-soft:#3d2120; --dn:#3987e5; --dn-soft:#1b2c43;
  --accent:#d95926; --m5:#f5b440; --m20:#f5b440; --ma:#d99520; --now:#3cc3e0; --band:#5c5b56; --warn-soft:#3a2f14; --warn-ink:#fab219; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:12px}
.stack{display:grid;gap:12px;min-width:0}
.tn{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 0}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.asof{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--wash);color:var(--ink2)}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h2 small{font-size:11px;font-weight:500;color:var(--muted)}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--ink2)}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--wash);padding:4px;border-radius:14px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab b{font-weight:600;color:var(--muted);margin-left:4px;font-size:12px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.06)}
.tab[aria-selected="true"] b{color:var(--ink2)}

/* 종목 선택 */
.picker{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.picker select{width:100%;min-width:0;appearance:none;-webkit-appearance:none;background:var(--surface);border:0;border-radius:12px;
  padding:11px 34px 11px 14px;font-size:16px;font-weight:600;box-shadow:0 0 0 1px var(--ring);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.step{height:44px;border:0;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px var(--ring);font-size:18px;color:var(--ink2);cursor:pointer}
.step:disabled{opacity:.35;cursor:default}
.count{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}

/* 종목 머리 */
.hero .name{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.hero .reg{font-size:12px;color:var(--muted);margin-top:2px}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-top:12px;flex-wrap:wrap}
.price{font-size:clamp(34px,10vw,42px);font-weight:700;letter-spacing:-.04em;line-height:1}
.price small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.wk{display:grid;justify-items:end;gap:2px}
.wk span{font-size:11px;color:var(--muted)}
.wk b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--grid)}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.tile b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.tile em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.tile b i{font-style:normal}

/* 보유 */
.hold{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.hold .pl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--wash)}
.hold .pl span{font-size:12px;color:var(--ink2)}
.hold .pl b{font-size:22px;font-weight:700;letter-spacing:-.03em}
.hold .pl i{font-style:normal;font-size:14px;font-weight:650;margin-left:8px}

.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

/* 최근 4거래일 등락률 (숫자) */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.days div{background:var(--wash);border-radius:10px;padding:7px 4px 6px;text-align:center}
.days span{display:block;font-size:11px;color:var(--muted)}
.days b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.days-cap{font-size:11px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--grid)}
.days-cap + .days{margin-top:6px}

/* 가격 목록 (기준·매수·최고가 / 이평·볼린저) */
.plist{display:grid}
.prow{display:grid;grid-template-columns:1fr auto 78px;gap:10px;align-items:center;min-height:46px;padding:6px 0;border-top:1px solid var(--grid)}
.prow:first-child{border-top:0}
.prow .lb{font-size:14px;font-weight:600;line-height:1.25}
.prow .lb em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
.prow .pv{font-size:15px;font-weight:650;text-align:right}
.prow .pc{text-align:right;line-height:1.2}
.prow .pc b{display:block;font-size:14px;font-weight:700}
.prow .pc em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.prow.now{background:var(--wash);border-radius:10px;margin:2px -8px;padding:6px 8px;border-top:0}
.prow.now + .prow{border-top:0}
.prow.mine .lb{color:var(--accent)}

/* 이평·볼린저 밴드 차트 */
.band{margin:4px 0 14px;padding:0 2px}
.band .lane{position:relative;height:20px;font-size:12px;color:var(--ink2)}
.band .bl{position:absolute;top:2px;white-space:nowrap;line-height:16px}
.band .bl.c{transform:translateX(-50%)} .band .bl.l{transform:translateX(-8px)} .band .bl.r{transform:translateX(calc(-100% + 8px))}
.band .bl b{font-weight:650;color:var(--ink)}
.band .bl.now{font-weight:700;color:var(--ink)}
.band .track{position:relative;height:24px;margin:2px 0 4px}
.band .track::before{content:"";position:absolute;left:0;right:0;top:11.5px;height:1px;background:var(--grid)}
.band .zone{position:absolute;top:4px;height:16px;border-radius:4px;background:var(--band)}
.band .mazone{position:absolute;top:4px;height:16px;background:var(--ma)}
.band .mk{position:absolute;top:0;width:4px;height:24px;margin-left:-2px;border-radius:2px;box-shadow:0 0 0 1.5px var(--surface)}
.band .dot{position:absolute;top:8px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--now);box-shadow:0 0 0 2px var(--surface)}
.m5{background:var(--m5)} .m20{background:var(--m20)}
.band .sw{display:inline-block;width:4px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.prow.m5 .lb::before,.prow.m20 .lb::before{content:"";display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.prow.m5 .lb::before{background:var(--m5)} .prow.m20 .lb::before{background:var(--m20)}
.prow.m5,.prow.m20{background:none}
.band .nowsw{width:8px;height:8px;border-radius:50%;background:var(--now);vertical-align:0}
.prow.now .lb::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--now);margin-right:6px;vertical-align:1px}

/* 기관·외인 수급 가로 막대 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--wash);padding:3px;border-radius:10px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.vgrid{display:grid}
.vrow{display:grid;gap:4px;align-items:center;padding:8px 0;border-top:1px solid var(--grid)}
.vrow.vhead{border-top:0;padding:0 0 4px;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
.vrow .lb{font-size:13px;font-weight:650;color:var(--ink);line-height:1.2}
.vrow .lb em{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--muted)}
.vc{display:grid;justify-items:center;gap:2px;min-width:0;text-align:center}
.vc .vt{position:relative;width:100%;height:40px}
.vc .vt::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:var(--axis)}
.vc .vb{position:absolute;left:50%;width:14px;margin-left:-7px}
.vc .vb.p{bottom:50%;background:var(--up);border-radius:4px 4px 0 0}
.vc .vb.n{top:50%;background:var(--dn);border-radius:0 0 4px 4px}
.vc b{font-size:13px;font-weight:700;white-space:nowrap;line-height:1.2}
.vc em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.vc .part{margin-left:0}
.vrow.sum{background:var(--wash);border-radius:10px;border-top:0;margin-top:4px;padding:8px 6px;margin-left:-6px;margin-right:-6px}
.part{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);margin-left:4px;vertical-align:1px}

/* 전체 값 표 */
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"펼치기";font-size:11px;font-weight:500;color:var(--muted)}
details[open] summary::after{content:"접기"}
.kv{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.kv td{padding:6px 0;border-top:1px solid var(--grid);vertical-align:top}
.kv td:first-child{color:var(--ink2);padding-right:10px;word-break:keep-all}
.kv td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.errs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:12.5px}
.errs li{padding:8px 10px;border-radius:10px;background:var(--wash);color:var(--ink2)}
.errs b{color:var(--ink);font-weight:650}

/* 잠금 화면 */
.lock{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.lock h1{font-size:20px}
.lock p{margin:0;font-size:13px;color:var(--ink2)}
.lock input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--ring);font-size:16px}
.lock label{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.lock .go{padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--page);font-size:15px;font-weight:700;cursor:pointer}
.lock .go:disabled{opacity:.5}
.lock .msg{min-height:18px;font-size:13px;color:var(--up)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<form class="lock" id="lock" hidden autocomplete="on">
  <h1>관심종목</h1>
  <p>암호를 입력하면 최근 결과를 볼 수 있습니다.</p>
  <input type="text" name="username" value="stock-pick" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="암호" required>
  <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
  <button class="go" id="go" type="submit">열기</button>
  <div class="msg" id="msg" role="alert"></div>
</form>

<!-- 본문 -->
<div class="wrap" id="app" hidden>
  <header>
    <h1>관심종목</h1>
    <div class="asof"><span class="chip tn" id="asof"></span><button class="iconbtn" id="logout" type="button">잠금</button></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="buy" id="t-buy">매수종목<b></b></button>
    <button class="tab" role="tab" data-tab="recent" id="t-recent">2개월이내<b></b></button>
  </div>
  <div class="picker">
    <button class="step" id="prev" type="button" aria-label="이전 종목">‹</button>
    <select id="sel" aria-label="종목 선택"></select>
    <button class="step" id="next" type="button" aria-label="다음 종목">›</button>
  </div>
  <div class="count tn" id="cnt"></div>
  <div id="view" class="stack"></div>
  <div class="card" id="errCard" hidden>
    <details><summary id="errSum"></summary><ul class="errs" id="errList"></ul></details>
  </div>
  <div class="note" id="built" style="text-align:center"></div>
</div>

<script>
"use strict";
const DATA_URL = "data.enc.json";
const KEY_PW = "sp_pw", KEY_TAB = "sp_tab", KEY_SEL = "sp_sel_";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── 복호화 (PBKDF2-SHA256 → AES-256-GCM) ── */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBlob(blob, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ── 숫자 표시: 엑셀 결과 파일의 표시 형식과 같게 ── */
const DATE_COLS = new Set(["등록일자","최고가일","거래량_날짜","5고가일","20고가일"]);
const INT_COLS = new Set(["시가총액","현재가","기준가","매수가","보유수량","매수금액","최고가","5일선","20일선",
  "볼린저up","볼린저lo","거래량_종가","5고가","20고가"]);
const RAW_COLS = new Set(["종목명","회전율"]);
const isNum = v => typeof v === "number" && isFinite(v);
const blank = v => v === null || v === undefined || v === "";
function fDate(v){ if (blank(v)) return "—"; const s = String(v); return /^\d{8}$/.test(s) ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6)}` : s; }
function fShortDate(v){ const s = String(v ?? ""); return /^\d{8}$/.test(s) ? `${+s.slice(4,6)}/${+s.slice(6)}` : s; }
function fInt(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-"; return Math.round(v).toLocaleString("ko-KR"); }
function fSignedInt(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-";
  return (v > 0 ? "+" : "-") + Math.abs(Math.round(v)).toLocaleString("ko-KR"); }
function fPct(v){ if (blank(v)) return "—"; if (!isNum(v)) return String(v); if (v === 0) return "-";
  return (v > 0 ? "+" : "-") + Math.abs(v).toFixed(2); }
const cls = v => !isNum(v) || v === 0 ? "fl" : v > 0 ? "up" : "dn";
function colType(name){
  if (DATE_COLS.has(name)) return "date";
  if (RAW_COLS.has(name) || name.endsWith("_자료확보")) return "raw";
  if (name === "평가손익") return "sint";
  if (INT_COLS.has(name) || name.endsWith("(평단)")) return "int";
  return "pct";
}
function fmt(name, v){
  switch (colType(name)){
    case "date": return fDate(v);
    case "raw": return blank(v) ? "—" : String(v);
    case "sint": return fSignedInt(v);
    case "int": return fInt(v);
    default: return fPct(v);
  }
}
const colored = (name, v) => `<span class="tn ${["pct","sint"].includes(colType(name)) ? cls(v) : ""}">${esc(fmt(name, v))}</span>`;
function fCap(v){ if (!isNum(v)) return "—"; const eok = v / 1e8;
  return eok >= 10000 ? (eok/10000).toFixed(eok >= 100000 ? 0 : 1) + "조" : Math.round(eok).toLocaleString("ko-KR") + "억"; }

/* ── 상태 ── */
let DATA = null, TAB = "buy";
const sheet = k => DATA.sheets[k] || {cols:[], rows:[]};
function rowObj(k, i){ const s = sheet(k), o = {}; s.cols.forEach((c, j) => o[c] = s.rows[i][j]); return o; }
function optLabel(k, i){
  const r = rowObj(k, i), s = sheet(k);
  const dup = s.rows.filter((_, j) => rowObj(k, j)["종목명"] === r["종목명"]).length > 1;
  return `${r["종목명"]} · ${fShortDate(r["등록일자"])}` + (dup ? " 등록" : "");
}

/* ── 그리기 ── */
function heroCard(r, k){
  const tiles = [
    ["시가총액", fCap(r["시가총액"]), ""],
    ["회전율", blank(r["회전율"]) ? "—" : esc(r["회전율"]), ""],
    ["기준가", fInt(r["기준가"]), "관심 등록 기준"],
  ];
  if (k === "recent"){
    tiles.push(["거래량일", fDate(r["거래량_날짜"]), ""],
      ["거래량일 종가", fInt(r["거래량_종가"]), ""],
      ["거래량일 등락률", `<i class="${cls(r["거래량_등락률"])}">${fPct(r["거래량_등락률"])}</i>`, ""]);
  }
  const days = ["D-3","D-2","D-1","D"].map(d => `<div><span>${d}</span><b class="${cls(r[d])}">${fPct(r[d])}</b></div>`).join("");
  return `<div class="card hero">
    <div class="name">${esc(r["종목명"])}</div>
    <div class="reg tn">등록일자 ${fDate(r["등록일자"])}</div>
    <div class="hero-row">
      <div class="price tn">${fInt(r["현재가"])}<small>원</small></div>
      <div class="wk"><span>주간등락률</span><b class="tn ${cls(r["주간등락률"])}">${fPct(r["주간등락률"])}%</b></div>
    </div>
    <div class="tiles tn">${tiles.map(([a,b,c]) => `<div class="tile"><span>${a}</span><b>${b}</b>${c ? `<em>${c}</em>` : ""}</div>`).join("")}</div>
    <div class="days-cap">최근 4거래일 등락률(%) · D = ${fDate(DATA.asof.replaceAll("-",""))}</div>
    <div class="days tn">${days}</div>
  </div>`;
}
function holdCard(r){
  return `<div class="card"><h2>보유</h2>
    <div class="hold tn">
      <div class="pl"><span>평가손익</span><div><b class="${cls(r["평가손익"])}">${fSignedInt(r["평가손익"])}</b><i class="${cls(r["매수가대비"])}">${fPct(r["매수가대비"])}%</i></div></div>
      <div class="tile"><span>보유수량</span><b>${fInt(r["보유수량"])}</b></div>
      <div class="tile"><span>매수금액</span><b>${fInt(r["매수금액"])}</b></div>
    </div></div>`;
}
/* 가격 한 줄: [이름, 보조설명, 가격, %값, %설명, 종류] */
function priceRows(items){
  return items.map(([lb, sub, v, pct, pcap, kind]) => `<div class="prow ${kind || ""}">
      <div class="lb">${lb}${sub ? `<em class="tn">${esc(sub)}</em>` : ""}</div>
      <div class="pv tn">${fInt(v)}</div>
      <div class="pc tn">${pct === undefined ? "" : `<b class="${cls(pct)}">${pct === 0 ? "0.00" : fPct(pct)}${isNum(pct) ? "%" : ""}</b>${pcap ? `<em>${pcap}</em>` : ""}`}</div>
    </div>`).join("");
}
function refCard(r, k){
  const hiDate = fShortDate(r["최고가일"]);
  const items = [];
  if (k === "buy") items.push(["매수가", "내 매수", r["매수가"], r["매수가대비"], "현재가 수익률", "mine"]);
  items.push(["기준가", "관심 등록 기준", r["기준가"]],
    ["최고가", hiDate ? `${hiDate} · 등록 후 최고` : "등록 후 최고", r["최고가"], r["최고가대비"], "기준가 대비"]);
  if (k === "recent") items.push(
    ["20거래일 고가", fShortDate(r["20고가일"]), r["20고가"], r["20고가_기준대비"], "기준가 대비"],
    ["5거래일 고가", fShortDate(r["5고가일"]), r["5고가"], r["5고가_기준대비"], "기준가 대비"]);
  const title = k === "buy" ? "매수가 · 기준가 · 최고가" : "기준가 · 최고가 · 고가";
  const shown = items.filter(it => isNum(it[2]) && it[2] !== 0);   // 자료가 없는 줄(예: 등록 당일 종목의 고가)은 숨김
  if (!shown.length) return "";
  return `<div class="card"><h2>${title}</h2><div class="plist">${priceRows(shown)}</div></div>`;
}
function lineCard(r){
  const cur = r["현재가"], m5 = r["5일선"], m20 = r["20일선"], up = r["볼린저up"], lo = r["볼린저lo"];
  const ok = v => isNum(v) && v !== 0;
  const items = [
    ["현재가", "", cur, undefined, "", "now"],
    ["5일선", "", m5, r["5일선대비"], "현재가 위치", "m5"],
    ["20일선", "", m20, r["20일선대비"], "현재가 위치", "m20"],
    ["볼린저 상단", "", up, r["볼린저up_대비"], "현재가 대비"],
    ["볼린저 하단", "", lo, r["볼린저lo_대비"], "현재가 대비"],
  ].filter(it => ok(it[2]));
  if (!ok(cur) || items.length < 2) return "";
  return `<div class="card"><h2>이동평균선 · 볼린저 밴드</h2>${bandChart(cur, m5, m20, up, lo)}
    <div class="plist">${priceRows(items)}</div>
    <div class="note">%는 엑셀 값 그대로입니다. 이평선은 현재가가 선보다 몇 % 위(+)·아래(−)인지, 볼린저는 밴드가 현재가보다 몇 % 위(+)·아래(−)인지입니다.</div></div>`;
}
/* 밴드 차트: 볼린저 하단~상단을 띠로, 5일선·20일선은 세로 표시, 현재가는 점 */
function bandChart(cur, m5, m20, up, lo){
  const ok = v => isNum(v) && v !== 0;
  const vals = [cur, m5, m20, up, lo].filter(ok);
  let a = Math.min(...vals), b = Math.max(...vals);
  const pad = (b - a) * 0.08 || a * 0.05; a -= pad; b += pad;
  const x = v => (v - a) / (b - a) * 100;
  const lbl = (v, html, cls2 = "") => {
    const p = x(v), anchor = p < 18 ? "l" : p > 82 ? "r" : "c";
    return `<span class="bl ${anchor} ${cls2}" style="left:${p.toFixed(2)}%">${html}</span>`;
  };
  const mazone = ok(m5) && ok(m20) ? `<i class="mazone" style="left:${x(Math.min(m5, m20)).toFixed(2)}%;width:${Math.abs(x(m5) - x(m20)).toFixed(2)}%"></i>` : "";   // 5일선~20일선 구간
  const zone = ok(up) && ok(lo) ? `<i class="zone" style="left:${x(lo).toFixed(2)}%;width:${(x(up) - x(lo)).toFixed(2)}%"></i>` : "";
  const mk = (v, c) => ok(v) ? `<i class="mk ${c}" style="left:${x(v).toFixed(2)}%"></i>` : "";
  const ends = [];
  if (ok(lo)) ends.push(lbl(lo, `하단 <b class="tn">${fInt(lo)}</b>`));
  if (ok(up)) ends.push(lbl(up, `상단 <b class="tn">${fInt(up)}</b>`));
  const narrow = ok(up) && ok(lo) && x(up) - x(lo) < 40;   // 띠가 좁으면 상단 글자를 한 줄 아래로
  return `<div class="band" role="img" aria-label="볼린저 밴드 안에서 현재가와 이동평균선 위치">
    <div class="lane">${lbl(cur, `<i class="sw nowsw"></i>현재가 <b class="tn">${fInt(cur)}</b>`, "now")}</div>
    <div class="track">${zone}${mazone}${mk(m20, "m20")}${mk(m5, "m5")}<i class="dot" style="left:${x(cur).toFixed(2)}%"></i></div>
    <div class="lane">${ok(m5) ? lbl(m5, `<i class="sw m5"></i>5일선 <b class="tn">${fInt(m5)}</b>`) : ""}</div>
    <div class="lane">${ok(m20) ? lbl(m20, `<i class="sw m20"></i>20일선 <b class="tn">${fInt(m20)}</b>`) : ""}</div>
    ${narrow ? `<div class="lane">${ends[0] || ""}</div><div class="lane">${ends[1] || ""}</div>` : `<div class="lane">${ends.join("")}</div>`}
  </div>`;
}
const full = s => { if (blank(s)) return true; const m = String(s).match(/^(\d+)\/(\d+)$/); return !m || m[1] === m[2]; };
let SUP_MODE = store.get("sp_sup") === "avg" ? "avg" : "flow";
function supplyCard(r){
  const per = [["5","5일"],["20거래일","20일"],["60거래일","60일"],["120거래일","120일"]];
  const flowCol = (inv, key) => inv === "합계" ? `${key}순매수` : `${inv}_순매수(${key})`;
  const NAME = { "기관": "기관", "외인": "외국인", "합계": "합계" };
  const cols = SUP_MODE === "flow" ? per : per.slice(1);
  const invs = SUP_MODE === "flow" ? ["기관","외인","합계"] : ["기관","외인"];
  const rows = invs.map(inv => ({ inv, cells: cols.map(([key]) => {
    if (SUP_MODE === "flow"){
      const c = flowCol(inv, key), cov = r[c + "_자료확보"];
      return { v: r[c], part: full(cov) ? "" : cov };
    }
    const n = key.replace("거래일", "");
    return { v: r[`${n}거래일/${inv}(평단%)`], sub: "평단 " + fInt(r[`${n}거래일/${inv}(평단)`]) };
  }) }));
  const nums = rows.flatMap(x => x.cells.map(c => c.v)).filter(isNum);
  if (!nums.length) return "";
  const max = Math.max(0, ...nums.map(Math.abs)) || 1;
  const cell = c => {
    const v = c.v, h = isNum(v) ? Math.abs(v) / max * 50 : 0;
    const bar = isNum(v) && v !== 0 ? `<i class="vb ${v > 0 ? "p" : "n"}" style="height:${h.toFixed(2)}%"></i>` : "";
    return `<div class="vc"><div class="vt">${bar}</div><b class="tn ${cls(v)}">${fPct(v)}</b>${
      c.part ? `<span class="part">${esc(c.part)}</span>` : ""}${c.sub ? `<em class="tn">${c.sub}</em>` : ""}</div>`;
  };
  const tpl = `grid-template-columns:50px repeat(${cols.length},1fr)`;
  const head = `<div class="vrow vhead" style="${tpl}"><div></div>${cols.map(([, lb]) => `<div>${lb}</div>`).join("")}</div>`;
  const body = rows.map(x => `<div class="vrow ${x.inv === "합계" ? "sum" : ""}" style="${tpl}"><div class="lb">${NAME[x.inv]}${
    x.inv === "합계" ? `<em>기관+외인</em>` : ""}</div>${x.cells.map(cell).join("")}</div>`).join("");
  const seg = (m, t) => `<button type="button" data-sup="${m}" aria-pressed="${SUP_MODE === m}">${t}</button>`;
  const cap = SUP_MODE === "flow" ? "상장주식수 대비 순매수 %(거래일 기준). 노란 표시는 자료가 일부만 확보된 기간(확보일/전체일)입니다."
    : "현재가가 기관·외국인 매수평단보다 몇 % 위(+)·아래(−)인지입니다(거래일 기준). 5일 평단은 엑셀에 없습니다.";
  return `<div class="card"><h2>기관 · 외국인 수급</h2>
    <div class="seg">${seg("flow", "순매수")}${seg("avg", "평단 대비 현재가")}</div>
    <div class="vgrid">${head}${body}</div><div class="note">${cap}</div></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sup]"); if (!b) return;
  SUP_MODE = b.dataset.sup; store.set("sp_sup", SUP_MODE);
  const y = window.scrollY; showRow(+$("sel").value); window.scrollTo(0, y);
});
function allCard(k, i){
  const s = sheet(k), row = s.rows[i];
  const body = s.cols.map((c, j) => `<tr><td>${esc(c)}</td><td>${colored(c, row[j])}</td></tr>`).join("");
  return `<div class="card"><details><summary>엑셀 전체 값 (${s.cols.length}개 열)</summary><table class="kv">${body}</table></details></div>`;
}

function render(){
  const s = sheet(TAB), sel = $("sel"), n = s.rows.length;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === TAB));
  if (!n){
    sel.innerHTML = `<option>종목 없음</option>`; sel.disabled = true;
    $("prev").disabled = $("next").disabled = true; $("cnt").textContent = "";
    $("view").innerHTML = `<div class="card empty">이 탭에 해당하는 종목이 없습니다.</div>`;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = s.rows.map((_, i) => `<option value="${i}">${esc(optLabel(TAB, i))}</option>`).join("");
  let i = parseInt(store.get(KEY_SEL + TAB), 10);
  if (!(i >= 0 && i < n)) i = 0;
  sel.value = String(i);
  showRow(i);
}
function showRow(i){
  const n = sheet(TAB).rows.length;
  store.set(KEY_SEL + TAB, String(i));
  $("sel").value = String(i);
  $("prev").disabled = i <= 0; $("next").disabled = i >= n - 1;
  $("cnt").textContent = `${i + 1} / ${n}`;
  const r = rowObj(TAB, i);
  $("view").innerHTML = heroCard(r, TAB) + (TAB === "buy" ? holdCard(r) : "") + refCard(r, TAB) + lineCard(r)
    + supplyCard(r) + allCard(TAB, i);
}

function start(data){
  DATA = data;
  $("lock").hidden = true; $("app").hidden = false;
  $("asof").textContent = fDate(data.asof.replaceAll("-","")) + " 기준";
  $("t-buy").querySelector("b").textContent = sheet("buy").rows.length;
  $("t-recent").querySelector("b").textContent = sheet("recent").rows.length;
  $("built").textContent = `결과 파일 ${data.file} · 웹 갱신 ${data.built}`;
  const e = sheet("errors");
  if (e.rows.length){
    $("errCard").hidden = false;
    $("errSum").textContent = `조회오류 ${e.rows.length}건`;
    $("errList").innerHTML = e.rows.map(row => {
      const o = {}; e.cols.forEach((c, j) => o[c] = row[j]);
      return `<li><b>${esc(o["구간"])}</b> · <span class="tn">${esc(o["종목코드"])} · 등록 ${fDate(o["등록일자"])}</span><br>${esc(o["내용"])}</li>`;
    }).join("");
  }
  const t = store.get(KEY_TAB); TAB = t === "recent" ? "recent" : "buy";
  render();
}

/* ── 이벤트 ── */
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { TAB = b.dataset.tab; store.set(KEY_TAB, TAB); render(); window.scrollTo(0, 0); }));
$("sel").addEventListener("change", e => showRow(+e.target.value));
$("prev").addEventListener("click", () => showRow(Math.max(0, +$("sel").value - 1)));
$("next").addEventListener("click", () => showRow(Math.min(sheet(TAB).rows.length - 1, +$("sel").value + 1)));
$("logout").addEventListener("click", () => { store.del(KEY_PW); location.reload(); });

let BLOB = null;
async function loadBlob(){
  if (BLOB) return BLOB;
  const res = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"});
  if (!res.ok) throw new Error("데이터 파일을 받지 못했습니다 (" + res.status + ")");
  return BLOB = await res.json();
}
async function unlock(pw, remember){
  const blob = await loadBlob();
  const data = await decryptBlob(blob, pw);
  if (remember) store.set(KEY_PW, pw); else store.del(KEY_PW);
  start(data);
}
$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value; if (!pw) return;
  $("go").disabled = true; $("go").textContent = "여는 중…"; $("msg").textContent = "";
  try { await unlock(pw, $("remember").checked); }
  catch (err){ $("msg").textContent = err && err.name === "OperationError" ? "암호가 맞지 않습니다." : (err.message || "열지 못했습니다."); }
  finally { $("go").disabled = false; $("go").textContent = "열기"; }
});
(async () => {
  if (!window.crypto || !crypto.subtle){ $("lock").hidden = false; $("msg").textContent = "이 브라우저에서는 열 수 없습니다(https 주소로 접속하세요)."; return; }
  const saved = store.get(KEY_PW);
  if (saved){
    try { await unlock(saved, true); return; }
    catch (err){ if (err && err.name === "OperationError") store.del(KEY_PW); else { $("msg").textContent = err.message || ""; } }
  }
  $("lock").hidden = false; $("pw").focus();
})();
</script>
</body>
</html>
